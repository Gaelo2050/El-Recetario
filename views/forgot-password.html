<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - El Recetario</title>
    <link rel="shortcut icon" href="../Imagenes/Logo/favicon.ico">
    <link href="../css/output.css" rel="stylesheet">
    <script src="/js/userSession.js"></script>
</head>

<body class="flex min-h-screen bg-gray-900 text-white">
    <!-- Left section (form) -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 md:px-16 lg:px-24">
        <!-- Logo -->
        <div class="mb-10">
            <div class="flex items-center justify-center">
                <a href="/inicio">
                    <img src="/Imagenes/Logo/logo  (1).png" alt="Logo El Recetario" class="h-16 w-auto mx-auto">
                </a>
            </div>
        </div>

        <!-- Mensaje (cuadro estilo modal/alerta) -->
        <div id="messageBox" class="mb-4 hidden max-w-sm mx-auto rounded-lg p-3 items-start gap-3 border shadow-sm"
            role="alert" aria-live="polite">
            <div id="messageIcon" class="text-xl leading-none"></div>
            <div class="text-left flex-1">
                <p id="messageText" class="text-sm font-medium"></p>
            </div>
            <button id="messageClose" aria-label="Cerrar mensaje"
                class="ml-2 text-white/80 hover:text-white">&times;</button>
        </div>

        <div id="resetMessageBox" class="mb-4 hidden max-w-sm mx-auto rounded-lg p-3 items-start gap-3 border shadow-sm"
            role="alert" aria-live="polite">
            <div id="resetMessageIcon" class="text-xl leading-none"></div>
            <div class="text-left flex-1">
                <p id="resetMessageText" class="text-sm font-medium"></p>
                <div id="resetMessageLink" class="mt-2 text-xs"></div>
            </div>
            <button id="resetMessageClose" aria-label="Cerrar mensaje"
                class="ml-2 text-white/80 hover:text-white">&times;</button>
        </div>

        <form action="/recuperar-contrasena" method="POST" class="space-y-6">
            <h2 class="text-3xl font-bold mb-2">Recuperar contraseña</h2>
            <p class="text-gray-600 mb-6">
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>
            <div>
                <label for="email" class="block text-sm font-medium mb-2">Correo electrónico</label>
                <input type="email" name="email" id="email" placeholder="tucorreo@ejemplo.com" required
                    class="w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
                Enviar enlace
            </button>

            <p class="text-center text-sm text-gray-500">
                ¿Ya tienes una cuenta?
                <a href="/iniciar-sesion" class=" text-blue-500 hover:underline font-medium">Inicia sesión</a>
            </p>
        </form>

        <!-- Right section (image) -->
    </div>

    <!-- Right section (image) -->
    <div class="hidden lg:block w-1/2">
        <img src="../Imagenes/Fondos/Fondo.jpg" alt="workspace" class="w-full h-full object-cover">
    </div>
    <script>
        (function () {
            const form = document.querySelector('form');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const box = document.getElementById('resetMessageBox');
            const text = document.getElementById('resetMessageText');
            const icon = document.getElementById('resetMessageIcon');
            const linkWrap = document.getElementById('resetMessageLink');
            const closeBtn = document.getElementById('resetMessageClose');
            if (closeBtn) closeBtn.addEventListener('click', () => { box.classList.add('hidden'); box.classList.remove('flex'); });

            async function sendReset(email) {
                submitBtn.disabled = true; submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
                const prevText = submitBtn.textContent; submitBtn.textContent = 'Enviando...';
                try {
                    box.classList.add('hidden'); linkWrap.innerHTML = '';
                    const res = await fetch('/api/restablecer-contrasena', {
                        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        icon.innerHTML = '✅'; box.classList.remove('hidden'); box.classList.add('flex'); box.classList.remove('bg-red-600/12', 'border-red-600'); box.classList.add('bg-emerald-600/12', 'border-emerald-600');
                        text.textContent = data.message || 'Correo de restablecimiento enviado. Revisa tu bandeja.';
                        if (data.link) linkWrap.innerHTML = `<a href="${data.link}" class="text-xs text-yellow-300 underline" target="_blank" rel="noopener">Abrir enlace de restablecimiento (prueba)</a>`;
                    } else {
                        icon.innerHTML = '⛔'; box.classList.remove('hidden'); box.classList.add('flex'); box.classList.remove('bg-emerald-600/12', 'border-emerald-600'); box.classList.add('bg-red-600/12', 'border-red-600');
                        text.textContent = data.error || 'No se pudo enviar el correo de restablecimiento.';
                    }
                } catch (e) {
                    console.error('Network error sending reset:', e);
                    icon.innerHTML = '⛔'; box.classList.remove('hidden'); box.classList.add('flex'); box.classList.remove('bg-emerald-600/12', 'border-emerald-600'); box.classList.add('bg-red-600/12', 'border-red-600');
                    text.textContent = 'Error de red. Intenta más tarde.';
                } finally {
                    submitBtn.disabled = false; submitBtn.classList.remove('opacity-60', 'cursor-not-allowed'); submitBtn.textContent = prevText;
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const email = (emailInput && emailInput.value) ? emailInput.value.trim() : '';
                if (!email) { alert('Introduce un correo válido'); return; }
                sendReset(email);
            });
        })();
    </script>
</body>

</html>
