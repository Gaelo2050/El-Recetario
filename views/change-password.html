<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - El Recetario</title>
    <link rel="shortcut icon" href="../Imagenes/Logo/favicon.ico">
    <link href="./css/output.css" rel="stylesheet">
    <script src="/js/userSession.js"></script>
</head>

<body class="flex min-h-screen bg-gray-900 text-white">
    <!-- Left section (image) -->
    <div class="hidden lg:block w-1/2">
        <img src="../Imagenes/Fondos/Fondo.jpg" alt="workspace" class="w-full h-full object-cover">
    </div>


    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 md:px-16 lg:px-24">
        <!-- Logo -->
        <div class="mb-10">
            <div class="flex items-center justify-center">
                <a href="/inicio">
                    <img src="/Imagenes/Logo/logo  (1).png" alt="Logo El Recetario" class="h-16 w-auto mx-auto">
                </a>
            </div>
        </div>

        <!-- Contenido principal -->
        <h2 class="text-3xl font-bold mb-2">Recuperar contraseña</h2>
        <p id="infoText" class="text-gray-500 text-center mb-6">
            Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <!-- Caja de mensaje -->
        <div id="resetMessageBox" class="mb-4 hidden max-w-sm mx-auto rounded-lg p-3 items-start gap-3 border shadow-sm"
            role="alert" aria-live="polite">

            <div id="resetMessageIcon" class="text-xl leading-none"></div>

            <div class="text-left flex-1">
                <p id="resetMessageText" class="text-sm font-medium"></p>
                <div id="resetMessageLink" class="text-sm font-medium"></div>
            </div>

            <button id="resetMessageClose" aria-label="Cerrar mensaje"
                class="ml-2 text-white/80 hover:text-white">&times;</button>
        </div>

        <form action="/recuperar-contrasena" method="POST" class="space-y-6">
            <div id="emailZone">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo
                    electrónico</label>
                <input type="email" name="email" id="email" placeholder="tucorreo@ejemplo.com"
                    class="w-full px-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-pink-400">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
                Enviar enlace
            </button>
        </form>

        <p class="text-center text-gray-500 mt-6 text-sm">
            <a href="/" class=" text-blue-500 hover:underline font-medium">Volver</a>
        </p>

        <script>
            (function () {
                const form = document.querySelector('form');
                const emailZone = document.getElementById('emailZone');
                const emailInput = document.getElementById('email');
                const submitBtn = document.getElementById('submitBtn');
                let sessionEmail = null;
                const box = document.getElementById('resetMessageBox');
                const closeBtnStatic = document.getElementById('resetMessageClose');
                if (closeBtnStatic) closeBtnStatic.addEventListener('click', () => { box.classList.add('hidden'); box.classList.remove('flex'); });

                async function sendReset(email) {
                    const text = document.getElementById('resetMessageText');
                    const icon = document.getElementById('resetMessageIcon');
                    const linkWrap = document.getElementById('resetMessageLink');
                    submitBtn.disabled = true; submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
                    const prevText = submitBtn.textContent;
                    submitBtn.textContent = 'Enviando...';
                    try {
                        box.classList.add('hidden');
                        linkWrap.innerHTML = '';
                        const res = await fetch('/api/restablecer-contrasena', {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        const data = await res.json().catch(() => ({}));
                        if (res.ok) {
                            icon.innerHTML = '✅';
                            box.classList.remove('hidden'); box.classList.add('flex');
                            box.classList.remove('bg-red-100', 'border-red-400');
                            box.classList.add('bg-emerald-600/10', 'border-emerald-600');
                            text.classList.add('text-emerald-100');
                            text.textContent = data.message || 'Correo de restablecimiento enviado. Revisa tu bandeja.';
                            if (data.link) {
                                linkWrap.innerHTML = `<a href="${data.link}" class="text-xs text-pink-600 underline" target="_blank" rel="noopener">Abrir enlace de restablecimiento (prueba)</a>`;
                            }
                        } else {
                            icon.innerHTML = '⛔';
                            box.classList.remove('hidden'); box.classList.add('flex');
                            box.classList.remove('bg-green-100', 'border-green-400');
                            box.classList.add('bg-red-600/10', 'border-red-600');
                            text.classList.add('text-red-100');
                            text.textContent = data.error || 'No se pudo enviar el correo de restablecimiento.';
                        }
                    } catch (e) {
                        console.error('Network error sending reset:', e);
                        icon.innerHTML = '⛔';
                        box.classList.remove('hidden'); box.classList.add('flex');
                        box.classList.remove('bg-green-100', 'border-green-400');
                        box.classList.add('bg-red-600/10', 'border-red-600');
                        text.classList.add('text-red-100');
                        text.textContent = 'Error de red. Intenta más tarde.';
                    } finally {
                        submitBtn.disabled = false; submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                        submitBtn.textContent = prevText;
                    }
                }

                (async function checkSession() {
                    try {
                        const res = await fetch('/api/usuario', { credentials: 'same-origin' });
                        if (res.ok) {
                            const user = await res.json();
                            if (user && user.email) {
                                const infoText = document.getElementById('infoText');
                                if (infoText) infoText.textContent = 'Se enviará un enlace de restablecimiento a: ' + user.email;
                                if (emailZone) emailZone.style.display = 'none';
                                submitBtn.textContent = 'Enviar';
                                sessionEmail = user.email;
                                return;
                            }
                        }
                    } catch (e) { console.debug('Could not fetch /api/usuario', e); }
                })();

                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const emailToUse = sessionEmail || (emailInput && emailInput.value ? emailInput.value.trim() : '');
                    if (!emailToUse) { alert('Introduce un correo válido'); return; }
                    sendReset(emailToUse);
                });
            })();
        </script>
</body>

</html>
